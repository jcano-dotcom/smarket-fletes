<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smarket Fletes — Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="panel-style.css" />
</head>
<body>

  <!-- LOGIN -->
  <section id="pantalla-login" class="pantalla">
    <div class="tarjeta-login">
      <h1>📍 Panel de Seguimiento</h1>
      <p class="subtitulo">Acceso solo para administración</p>
      <form id="form-login">
        <input type="text" id="input-usuario" placeholder="Usuario" autocomplete="username" required />
        <input type="password" id="input-password" placeholder="Contraseña" autocomplete="current-password" required />
        <button type="submit">Ingresar</button>
      </form>
      <p id="error-login" class="mensaje-error"></p>
    </div>
  </section>

  <!-- PANEL -->
  <section id="pantalla-panel" class="pantalla oculto">
    <header class="encabezado">
      <div class="resumen">
        <span class="chip chip-pendiente"><strong id="cant-pendientes">0</strong> pendientes</span>
        <span class="chip chip-entregado"><strong id="cant-entregados">0</strong> entregados</span>
        <span class="chip chip-cancelado"><strong id="cant-cancelados">0</strong> cancelados</span>
      </div>
      <div class="controles">
        <select id="filtro-chofer">
          <option value="">Todos los choferes</option>
        </select>
        <span id="ultima-actualizacion" class="texto-secundario"></span>
        <button id="btn-salir" class="btn-secundario">Salir</button>
      </div>
    </header>

    <div id="mapa"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="panel.js"></script>
</body>
</html>
